<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="8; url=https://blog.xspirit.org">
  <title>Page Moved — blog.xspirit.org</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #fff;
      color: #222;
    }
    .container {
      text-align: center;
      max-width: 460px;
      padding: 2rem;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    p {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }
    a.url {
      display: inline-block;
      font-size: 1.1rem;
      font-weight: 600;
      color: #0055d4;
      border: 2px solid #0055d4;
      padding: 0.6rem 1.8rem;
      border-radius: 4px;
      text-decoration: none;
    }
    a.url:hover { background: #0055d4; color: #fff; }
    .note {
      margin-top: 1.5rem;
      font-size: 0.82rem;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>This page has moved to a new address</h1>
    <p>The content you are looking for is now at:</p>
    <a class="url" href="https://blog.xspirit.org">blog.xspirit.org</a>
    <p class="note">You will be redirected automatically in <span id="t">8</span>s.</p>
  </div>
  <script>
    let c = 8, e = document.getElementById('t');
    setInterval(() => { if (c > 0) e.textContent = --c; }, 1000);
  </script>
</body>
</html>

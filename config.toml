base_url = "https://blog.jpixy.com"

title = "Hi! This is Johnny"
description = "Johnny's Tech Blog"
default_language = "en"

compile_sass = true
minify_html = false  # 开发时关闭，减少构建时间
build_search_index = true
generate_feeds = true
feed_filenames = ["rss.xml"]

taxonomies = [
    { name = "tags", feed = false },  # 关闭tag feed
]

[slugify]
paths = "safe"  # 保留中文字符在URL中

[search]
include_title = true
include_description = true
include_path = true
include_content = true

[markdown]
highlight_code = true
highlight_theme = "inspired-github"
smart_punctuation = true

# [link_checker]  # 暂时禁用，加速构建
# internal_level = "warn"
# skip_anchor_prefixes = ["#"]

generate_sitemap = true
generate_robots_txt = false

[extra]
author = "Johnny"
github = "https://github.com/jpixy"
